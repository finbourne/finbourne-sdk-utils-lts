[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finbourne-sdk-utils"
version = "0.0.41"
description = "Python utilities for LUSID V2 SDK"
license = { text = "MIT" }
authors = [
    { name = "FINBOURNE Technology", email = "engineering@finbourne.com" },
]
keywords = ["FINBOURNE", "LUSID", "LUSID SDK", "python"]
requires-python = ">=3.11"
dependencies = [
    "urllib3>=2.7.0",
    "requests>=2.27.1",
    "coloredlogs>=14.0",
    "detect-delimiter>=0.1",
    "flatten-json>=0.1.7",
    "pandas>=1.1.4,<=2.3.3",
    "PyYAML>=5.4",
    "tqdm>=4.52.0",
    "openpyxl>=3.0.7",
    "xlrd~=1.2",
    "pytz>=2019.3",
    "ipython==8.32",
    "lusidfeature",
    "finbourne-access-sdk>=2.4.5",
    "finbourne-identity-sdk>=2.3.15",
    "lusid-sdk>=2.3.202",
    "lusid-configuration-sdk>=2.3.4",
    "pygments==2.20.0",
]

[project.urls]
Homepage = "https://github.com/finbourne/finbourne-sdk-utils"

[dependency-groups]
dev = [
    "bump2version==1.0.0",
    "parameterized==0.7.4",
    "pytest==9.0.2",
]
